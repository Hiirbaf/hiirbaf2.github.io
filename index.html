<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing Board</title>
    <meta content="#062c40" name="theme-color" />
    <link href="/main.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Prompt">
    <link rel="stylesheet" href="drawbox.css" />
</head>

<body>
<!-- Header -->
<nav style="z-index: 10000;">
    <div class="container-header-gallery">
        <a style="text-decoration:none" href="/" title="HOME"><button>HOME</button></a>
        <a style="text-decoration:none" href="/about" title="ABOUT"><button>ABOUT</button></a>
        <a style="text-decoration:none" href="/gallery" title="GALLERY"><button>GALLERY</button></a>
        <a style="text-decoration:none" href="/misc" title="MISC"><button style="color: lightblue;box-shadow: 0 0 0 5px lightblue;">MISC</button></a>
    </div>
</nav>

<!-- Floating image -->
<div class="img-float"><img src="/images/float/drawbox-float.png" alt="" style="width: 35%; height: 35%;"></div>

<div class="boxed" style="background:none; outline: none;box-shadow: none; padding-top: 0px;">
    <div class="drawbox_con">

        <!--  main canvas  -->
        <div class="TheCanvas">
            <canvas id="drawboxcanvas" width="500" height="500"></canvas>
            <br>
            <input type="button" id="drawBtn" class="active-tool" value="Draw" onclick="setErase(false)">
            <input type="button" id="eraseBtn" value="Erase" onclick="setErase(true)">
            <input type="button" value="Undo (Ctrl+Z)" onclick="Undo()" title="you can also do ctrl+z">
            <input type="button" value="Clear" onclick="clearCanvas()" title="clear canvas">
        </div>

        <!--  canvas options  -->
        <fieldset class="boxed" style="background:none; outline: none;box-shadow: none; padding-top: 0px;border: none; margin-bottom: 0px;">
            <div class="tbox" id="canvasoptions" style="margin: auto;background:url(/images/triangle3-seamless3.jpg); width: 70%; text-align: left; background-size: 80%; background-attachment: fixed; line-height: 40px;">

                <!-- paletas (la del halftone se añade sola desde drawbox.js) -->
                <div id="Basic" class="colorPalette">

                        <div onclick="change_color(this); colorchoice.value = 'Black' ; colorpicker.value = '#000000'" style="background: #000000" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Dark Gray' ; colorpicker.value = '#444444'" style="background: #444444;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Light Gray' ; colorpicker.value = '#999999'" style="background: #999999;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'White' ; colorpicker.value = '#ffffff'" style="background: #ffffff;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Red' ; colorpicker.value = '#DB3232'" style="background: #DB3232" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Dark Red' ; colorpicker.value = '#6E0000'" style="background: #6E0000" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Orange' ; colorpicker.value = '#F0843E'" style="background: #F0843E" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Brown' ; colorpicker.value = '#451F0A'" style="background: #451F0A" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Yellow' ; colorpicker.value = '#FCFC5B'" style="background: #FCFC5B" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Light Green' ; colorpicker.value = '#1DE23E'" style="background: #1DE23E" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Green' ; colorpicker.value = '#1F915F'" style="background: #1F915F" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Dark Green' ; colorpicker.value = '#025531'" style="background: #025531" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Cyan' ; colorpicker.value = '#50DCDE'" style="background: #50DCDE" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Blue' ; colorpicker.value = '#559BE0'" style="background: #559BE0" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Dark Blue' ; colorpicker.value = '#081A52'" style="background: #081A52" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Purple' ; colorpicker.value = '#A35AED'" style="background: #A35AED" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Dark Purple' ; colorpicker.value = '#571375'" style="background: #571375" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Pink' ; colorpicker.value = '#FA7AD2'" style="background: #FA7AD2" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Magenta' ; colorpicker.value = '#f830ae'" style="background: #f830ae" class="stroke_color"></div>

                    </div>

                    <div id="Drawception" class="colorPalette">

                        <div onclick="change_color(this); colorchoice.value = 'Black' ; colorpicker.value = '#000000'" style="background: #000000" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Dark Gray' ; colorpicker.value = '#444444'" style="background: #444444;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Light Gray' ; colorpicker.value = '#999999'" style="background: #999999;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'White' ; colorpicker.value = '#ffffff'" style="background: #ffffff;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Brown' ; colorpicker.value = '#603913'" style="background: #603913;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Tan' ; colorpicker.value = '#c69c6d'" style="background: #c69c6d;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Light Tan' ; colorpicker.value = '#ffdab9'" style="background: #ffdab9;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Cream Yellow' ; colorpicker.value = '#fffdc9'" style="background: #fffdc9;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Red' ; colorpicker.value = '#ff0000'" style="background: #ff0000;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Yellow' ; colorpicker.value = '#ffd700'" style="background: #ffd700;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Orange' ; colorpicker.value = '#ff6600'" style="background: #ff6600;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Light Green' ; colorpicker.value = '#16ff00'" style="background: #16ff00;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Green' ; colorpicker.value = '#0fad00'" style="background: #0fad00;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Light Blue' ; colorpicker.value = '#00ffff'" style="background: #00ffff;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Blue' ; colorpicker.value = '#0247fe'" style="background: #0247fe;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Hot Pink' ; colorpicker.value = '#ec008c'" style="background: #ec008c;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Purple' ; colorpicker.value = '#8601af'" style="background: #8601af;" class="stroke_color"></div>


                    </div>

                    <div id="CN" class="colorPalette">
                        <div onclick="change_color(this); colorchoice.value = 'White' ; colorpicker.value = '#ffffff'" style="background: #ffffff;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Cyan' ; colorpicker.value = '#00C2FF'" style="background: #00C2FF;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Magenta' ; colorpicker.value = '#FF00C2'" style="background: #FF00C2;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Yellow' ; colorpicker.value = '#fad400'" style="background: #fad400;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Black' ; colorpicker.value = '#000000'" style="background: #000000" class="stroke_color"></div>
                    </div>

                    <div id="GameBoy" class="colorPalette">
                        <div onclick="change_color(this); colorchoice.value = 'Palm Leaf' ; colorpicker.value = '#0f380f'" style="background: #0f380f;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Killarney' ; colorpicker.value = '#306230'" style="background: #306230;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Pistachio' ; colorpicker.value = '#8bac0f'" style="background: #8bac0f;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Citrus' ; colorpicker.value = '#9bbc0f'" style="background: #9bbc0f;" class="stroke_color"></div>
                    </div>

                    <div id="AutumnHarvest" class="colorPalette">
                        <div onclick="change_color(this); colorchoice.value = 'Dark Wine' ; colorpicker.value = '#6f1d1b'" style="background: #6f1d1b;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Camel' ; colorpicker.value = '#BB9457'" style="background: #BB9457;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Dark Coffee' ; colorpicker.value = '#432818'" style="background: #432818;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Chocolate Brown' ; colorpicker.value = '#99582a'" style="background: #99582a;" class="stroke_color"></div>
                        <div onclick="change_color(this); colorchoice.value = 'Light Apricot' ; colorpicker.value = '#ffe6a7'" style="background: #ffe6a7;" class="stroke_color"></div>
                    </div>

                <label for="colorpicker"><strong>Color:&nbsp;</strong></label>
                <input type="color" name="colorpicker" id="colorpicker" oninput="pickColor(this.value)" style="border-radius: 5px;">
                <output name="colorchoice" id="colorchoice" for="colorpicker" style="min-width: 110px; display: inline-block;">Black</output>

                <span style="display: inline-block;">
                    <label for="Strokewidth" style="padding-left: 10px;"><strong>Size:&nbsp;</strong></label>
                    <input type="range" id="Strokewidth" name="Strokewidth" min="1" max="100" value="3" oninput="stroke_width = this.value; StrokeAmount.value=this.value" title="stroke width">
                    <input type="number" id="StrokeAmount" min="1" max="100" value="3" oninput="stroke_width = this.value; Strokewidth.value=this.value">
                </span>

                <span style="display: inline-block;">
                    <label for="Opacity"><strong>Opacity:&nbsp;</strong></label>
                    <input type="range" id="Opacity" name="Opacity" step="0.05" min="0.05" max="1" value="1" oninput="line_opacity = this.value; OpacityAmount.value=this.value" title="Opacity">
                    <output name="OpacityAmount" id="OpacityAmount" for="Opacity" style="display: inline-block; min-width: 40px;">1.00</output><br>
                </span>

                <!--  color palette picker  -->
                <span style="display: inline-block;">
                    <label><strong>Color Palette:</strong></label>
                    <select name="palette" id="palette" onchange="showDiv()">
                        <option value="Basic">Default</option>
                        <option value="Drawception">Drawception</option>
                        <option value="CN">CN</option>
                        <option value="AutumnHarvest">Autumn Harvest</option>
                        <option value="GameBoy">Game Boy</option>
                    </select>
                </span> <br>

                <span style="display: inline-block;">
                    <label for="artist-name"><strong>Name:</strong></label>
                    <input type="text" id="artist-name" oninput="user_name = this.value" required maxlength="15" size="15" placeholder="anonymous">
                </span>

                <input type="button" id="submit" value="Submit">

                <span style="display: inline-block;">
                    <label for="BrushType"><strong>Brush Type:</strong></label>
                    <select id="BrushType" name="BrushType" oninput="stroke_join = this.value">
                        <option value="round" selected>Round</option>
                        <option value="bevel">Bevel</option>
                        <option value="miter">Miter</option>
                    </select><span> | </span>
                    <label for="LineCap"><strong>Line Cap:</strong></label>
                    <select id="LineCap" name="LineCap" oninput="line_cap = this.value">
                        <option value="round" selected>Round</option>
                        <option value="butt">Butt</option>
                        <option value="square">Square</option>
                    </select>
                </span>
                <br>
            </div>
        </fieldset>

        <p id="status"></p>
        <p>Please be respectful. Your drawing appears after it is approved. Spam, blank canvases and a few lines will be deleted. &lt;3</p>
    </div>
</div>

<!--  submitted drawings section  -->
<div class="boxed" style="background: url(/images/checker-diamond.png); background-size: 10%; width: 80%; margin-top: 0px;" id="animatedBackground2">
    <h1>Submitted Drawings ☺</h1>
    <div id="gallery" class="tbox" style="align-items: center;">Loading images... <img src="/images/loading.gif" width="100"><br></div>
    <input type="button" id="loadMore" value="Load more">
    <font color="white">Powered by <a href="https://3maqi.art/a/drawbox_guide" target="_blank">Drawbox</a></font>
</div>

<script src="drawbox.js"></script>

<!-- Scroll Buttons -->
<div id="scrollBottom"></div>
<a class="scroll-top" href="#"><img src="/images/totop.png" style="width: 60%;" alt="scroll to top"></a>
<a class="scroll-bot" href="#scrollBottom"><img src="/images/tobot.png" style="width: 60%;" alt="scroll to bottom"></a>

    <div class="left" style="padding-top:65px;cursor: default;">© YOUR NAME <script>document.write(new Date().getFullYear());</script> • All rights reserved.</div>
    <div class="footercontent" style="padding-top:55px; min-width: 100%;cursor: default;">

        <a href="/about">About</a> •
        <a href="/gallery.html">Gallery</a> •
        <a href="/misc.html">Misc</a> •
    </div>
</footer>
</body>
</html>
